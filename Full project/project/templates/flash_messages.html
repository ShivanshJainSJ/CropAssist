<!-- Flash Messages -->
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="fixed top-20 right-4 z-50 space-y-2">
      {% for message in messages %}
        <div class="flash-message bg-white border-l-4 {% if '✅' in message %}border-green-500 text-green-700{% elif '🔒' in message or '❌' in message %}border-red-500 text-red-700{% elif '⚠️' in message %}border-yellow-500 text-yellow-700{% else %}border-blue-500 text-blue-700{% endif %} p-4 shadow-lg rounded-r-lg animate-slideInRight max-w-sm">
          <div class="flex items-center">
            <p class="font-medium text-sm">{{ message }}</p>
            <button onclick="this.parentElement.parentElement.remove()" class="ml-4 text-gray-400 hover:text-gray-600 focus:outline-none">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
              </svg>
            </button>
          </div>
        </div>
      {% endfor %}
    </div>
    
    <style>
      @keyframes slideInRight {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      
      .animate-slideInRight {
        animation: slideInRight 0.3s ease-out;
      }
      
      .flash-message {
        transition: all 0.3s ease;
      }
      
      .flash-message:hover {
        transform: translateX(-2px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      }
    </style>
    
    <script>
      // Auto-hide flash messages after 5 seconds
      document.addEventListener('DOMContentLoaded', function() {
        const flashMessages = document.querySelectorAll('.flash-message');
        flashMessages.forEach(function(message) {
          setTimeout(function() {
            message.style.opacity = '0';
            message.style.transform = 'translateX(100%)';
            setTimeout(function() {
              if (message.parentElement) {
                message.remove();
              }
            }, 300);
          }, 5000);
        });
      });
    </script>
  {% endif %}
{% endwith %}
